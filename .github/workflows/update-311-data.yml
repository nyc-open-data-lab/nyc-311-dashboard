name: Update NYC 311 Data

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-311-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install required R packages
        shell: Rscript {0}
        run: |
          install.packages(c(
            "arrow",
            "dplyr",
            "nycOpenData"
          ))

      - name: Refresh NYC 311 data
        shell: Rscript {0}
        run: |
          library(arrow)
          library(dplyr)
          library(nycOpenData)

          source("R/data.R")
          refresh_311_data()

      - name: Commit updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/311_cache.parquet

          if git diff --cached --quiet; then
            echo "NYC 311 data is already up to date."
          else
            git commit -m "Update NYC 311 data"
            git push "https://x-access-token:${GH_TOKEN}@github.com/nyc-open-data-lab/nyc-311-dashboard.git" HEAD:main
          fi

      - name: Mirror repository to personal GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          mkdir -p /tmp/nyc311-deploy

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            ./ /tmp/nyc311-deploy/

          cd /tmp/nyc311-deploy

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Sync NYC 311 Dashboard"

          git branch -M main

          git remote add origin "https://martinezc1:${MIRROR_TOKEN}@github.com/martinezc1/nyc-311-dashboard.git"

          git push origin main --force
